<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a jersey · Eleven Jersey</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon.png" sizes="278x278">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  body { max-width: 600px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--ink-soft); }
  input, select, textarea { width: 100%; }
  textarea { min-height: 72px; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  form button { margin-top: 16px; }
  #forget { background: none; color: var(--ink-soft); }
  label small { display: block; margin-top: 2px; min-height: 1em; }
  #result { white-space: pre-wrap; margin-top: 16px; }
  #result textarea { min-height: 160px; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
<header>
  <a href="index.html"><img src="logo.png" alt="Eleven Jersey" class="logo"></a>
  <a href="index.html" class="button">Collection</a>
</header>
<h1>Add a jersey</h1>
<form id="add">
  <label>Link to the item<input name="link" type="url" placeholder="https://… (shop page, optional)"></label>
  <label>Club or national team *<input name="team" list="teams" required autocomplete="off"></label>
  <label>Country<input name="country" list="countries" autocomplete="off"><small id="countryHint"></small></label>
  <div class="row">
    <div><label>Season *<input name="season" list="seasons" required autocomplete="off"><small id="seasonHint"></small></label></div>
    <div><label>Kit *<select name="kit" required>
      <option value="">—</option><option>home</option><option>away</option><option>third</option><option>fourth</option>
      <option>special</option><option>training</option><option>goalkeeper</option></select></label></div>
  </div>
  <div class="row">
    <div><label>Brand<input name="brand" list="brands" autocomplete="off"><small id="brandHint"></small></label></div>
    <div><label>Version<select name="version">
      <option value=""></option>
      <option value="player issue">Player issue (authentic)</option>
      <option value="replica">Replica (fan version)</option>
      <option value="match worn">Match worn</option>
      <option value="match issued">Match issued, unworn</option>
      <option value="retro">Retro reissue</option>
      <option value="unofficial">Unofficial copy</option></select></label></div>
  </div>
  <div class="row">
    <div><label>Size<select name="size"><option value=""></option><option>Kids</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select></label></div>
    <div><label>Status *<select name="status" required><option value="yes">in collection</option><option value="wishlist">wishlist</option><option value="bought">bought, on its way</option></select></label></div>
  </div>
  <div class="row">
    <div><label>Number<input name="number" inputmode="numeric" autocomplete="off"></label></div>
    <div><label>Player<input name="player" autocomplete="off"><small id="playerHint"></small></label></div>
  </div>
  <label>Description<textarea name="description" placeholder="What the shirt is about: the idea behind the design, references, easter eggs"></textarea></label>
  <label>Notes<input name="comment"></label>
  <label>Photo<input name="photo" type="file" accept="image/*"></label>
  <datalist id="teams"></datalist><datalist id="countries"></datalist><datalist id="seasons"></datalist><datalist id="brands"></datalist>
  <button type="submit" class="button">Save to GitHub</button>
  <button type="button" id="forget" class="button" hidden>Forget token</button>
</form>
<div id="result"></div>
<script src="wiki.js"></script>
<script>
const REPO = 'petr-gerasimov/jersey-collection';
const form = document.getElementById('add');
const result = document.getElementById('result');
const countryHint = document.getElementById('countryHint');
const seasonHint = document.getElementById('seasonHint');
const playerHint = document.getElementById('playerHint');
const brandHint = document.getElementById('brandHint');
const forget = document.getElementById('forget');
let kits = [], teams = [];

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const uniq = a => [...new Set(a.filter(Boolean))].sort();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fill(id, values) { document.getElementById(id).innerHTML = values.map(v => `<option value="${esc(v)}">`).join(''); }

Promise.all([fetch('kits.json').then(r => r.json()), fetch('teams.json').then(r => r.json())]).then(([k, t]) => {
  kits = k; teams = t;
  fill('teams', uniq([...teams.map(x => x.name), ...kits.map(x => x.team)]));
  fill('countries', uniq([...teams.map(x => x.country), ...kits.map(x => x.country)]));
  fill('brands', uniq(kits.map(x => x.brand)));
  seasonList();
});
forget.hidden = !localStorage.getItem('gh_token');

const known = name => teams.find(t => t.name.toLowerCase() === name.toLowerCase());
const isNational = name => !!known(name)?.national;

// Leagues that play spring to autumn name a season by one year; the rest by two, 2023-24.
const CALENDAR_YEAR = ['Sweden', 'Norway', 'Finland', 'Iceland', 'Ireland', 'Estonia', 'Latvia', 'Lithuania', 'Belarus', 'Kazakhstan',
  'Japan', 'South Korea', 'China', 'United States', 'Canada', 'Brazil', 'Argentina', 'Chile', 'Colombia', 'Peru', 'Ecuador', 'Uruguay', 'Paraguay', 'Bolivia', 'Venezuela'];
const seasonStyle = () => isNational(form.team.value.trim()) || CALENDAR_YEAR.includes(form.country.value.trim()) ? 'year' : 'split';
function seasonList() {
  const y = new Date().getFullYear(), years = Array.from({ length: y - 1949 }, (_, i) => y - i);
  const split = seasonStyle() === 'split';
  fill('seasons', years.map(n => split ? `${n}-${String(n + 1).slice(2)}` : String(n)));
  form.season.placeholder = split ? `${y - 1}-${String(y).slice(2)}` : String(y - 1);
  seasonHint.textContent = split ? 'autumn–spring season: two years, 2023-24' : 'one year: a national team or a spring–autumn league';
}
function checkSeason() {
  const s = form.season.value.trim(), m = s.match(/^(\d{4})(?:-(\d{2}))?$/);
  let error = '';
  if (!m) error = 'Season is 2023-24 or 2024';
  else if (m[2] && (Number(m[1]) + 1) % 100 !== Number(m[2])) error = 'The second year must follow the first: 2023-24';
  // shortcut: Russia played spring–autumn until 2011, so both forms pass there; refine when another such country shows up
  else if (seasonStyle() === 'split' && !m[2] && form.country.value.trim() !== 'Russia') error = 'This league names a season by two years: 2023-24';
  else if (seasonStyle() === 'year' && m[2]) error = 'A national team or a spring–autumn league names a season by one year: 2024';
  form.season.setCustomValidity(error);
  return !error;
}

// Country and brand come from the teams list and the kits already in the collection; a new club's country from Wikidata.
async function autofill() {
  const team = form.team.value.trim(), season = form.season.value.trim();
  const same = kits.filter(k => k.team.toLowerCase() === team.toLowerCase());
  if (!form.country.value && team) {
    const k = known(team)?.country || same.find(k => k.country)?.country;
    if (k) { form.country.value = k; countryHint.textContent = known(team) ? 'from the teams list' : 'from the collection'; }
    else {
      countryHint.textContent = 'asking Wikidata…';
      try { form.country.value = await wiki.country(team); countryHint.textContent = form.country.value ? 'from Wikidata, check it' : 'not found, type it'; }
      catch { countryHint.textContent = 'Wikidata did not answer'; }
    }
  }
  seasonList();
  // brand: the same season in the collection, else the league's kit table on Wikipedia, else the club's latest kit here;
  // a value the form filled in is replaced when the season changes, a typed one is kept
  if ((!form.brand.value || brandHint.dataset.auto) && team && season) {
    const sameSeason = same.find(k => k.season === season && k.brand)?.brand, league = known(team)?.league;
    let brand = sameSeason, how = 'from the collection';
    if (!brand && league) {
      brandHint.textContent = 'looking up the league on Wikipedia…';
      try { brand = await wiki.kitMaker(league, season, team); how = 'from Wikipedia'; } catch { brand = ''; }
    }
    if (!brand) { brand = same.filter(k => k.brand).slice(-1)[0]?.brand || ''; how = 'from another season here'; }
    form.brand.value = brand; brandHint.dataset.auto = '1';
    brandHint.textContent = brand ? `${how}, check it` : 'not found, type it';
  }
}

// The player comes from the squad table on the club's Wikipedia season page.
let lookup = 0;
async function playerByNumber() {
  const team = form.team.value.trim(), season = form.season.value.trim(), n = form.number.value.trim(), id = ++lookup;
  if (!(team && season && n)) return;
  if (isNational(team)) { playerHint.textContent = 'no squad list for national teams, type the name'; return; }
  playerHint.textContent = 'looking up the squad on Wikipedia…';
  try {
    const title = await wiki.findSeasonPage(team, season);
    if (id !== lookup) return;
    if (!title) { playerHint.textContent = 'no Wikipedia season page, type the name'; return; }
    const name = (await wiki.seasonInfo(title)).squad[n];
    if (id !== lookup) return;
    if (name) { form.player.value = name; playerHint.textContent = `from ${title}, check it`; }
    else playerHint.textContent = `number ${n} is not in the squad on ${title}`;
  } catch (e) { playerHint.textContent = 'Wikipedia did not answer: ' + e.message; }
}
let timer;
const soon = fn => { clearTimeout(timer); timer = setTimeout(fn, 500); };
form.team.addEventListener('change', autofill);
form.brand.addEventListener('input', () => { delete brandHint.dataset.auto; brandHint.textContent = ''; });
form.country.addEventListener('change', seasonList);
form.season.addEventListener('change', () => { autofill(); checkSeason(); playerByNumber(); });
form.season.addEventListener('input', () => form.season.setCustomValidity(''));
form.number.addEventListener('input', () => soon(playerByNumber));

const b64 = bytes => btoa(String.fromCharCode(...bytes));
const utf8 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    ...opts, headers: { Authorization: `Bearer ${localStorage.getItem('gh_token')}`, Accept: 'application/vnd.github+json', ...(opts.headers || {}) } });
  if (!r.ok) throw new Error(`GitHub ${r.status} on ${path}: ${(await r.json()).message || ''}`);
  return r.json();
}

function record() {
  const f = new FormData(form), kit = {};
  for (const key of ['status', 'team', 'country', 'season', 'kit', 'brand', 'version', 'size', 'number', 'player', 'description', 'comment', 'link']) {
    const v = (f.get(key) || '').trim();
    if (v) kit[key] = v;
  }
  const photo = form.photo.files[0];
  if (photo) kit.photo = [slug(kit.team), kit.season, kit.kit, Date.now().toString(36)].join('-') + '.' + (photo.name.split('.').pop() || 'jpg').toLowerCase();
  return kit;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!checkSeason()) { form.season.reportValidity(); return; }
  const kit = record();
  if (!localStorage.getItem('gh_token')) {
    const t = prompt('GitHub token with write access to the repository (fine-grained, Contents: read and write). It stays in this browser only. Leave empty to get the JSON to paste by hand.');
    if (t) { localStorage.setItem('gh_token', t.trim()); forget.hidden = false; }
  }
  if (!localStorage.getItem('gh_token')) {
    result.innerHTML = `Add this to kits.json${kit.photo ? ` and put the photo in photos/${esc(kit.photo)}` : ''}:<br><textarea readonly>${esc(JSON.stringify(kit, null, 1))}</textarea>`;
    return;
  }
  result.textContent = 'Saving…';
  try {
    const photo = form.photo.files[0];
    if (photo) {
      const bytes = new Uint8Array(await photo.arrayBuffer());
      await gh(`photos/${kit.photo}`, { method: 'PUT', body: JSON.stringify({ message: `Photo: ${kit.team} ${kit.season} ${kit.kit}`, content: b64(bytes) }) });
    }
    const cur = await gh('kits.json', { headers: { 'If-None-Match': '' } });
    const all = JSON.parse(utf8(cur.content));
    all.push(kit);
    const body = new TextEncoder().encode(JSON.stringify(all, null, 1));
    await gh('kits.json', { method: 'PUT', body: JSON.stringify({ message: `Add ${kit.team} ${kit.season} ${kit.kit}`, content: b64(body), sha: cur.sha }) });
    kits = all;
    result.innerHTML = `Saved: <b>${esc(kit.team)} ${esc(kit.season)} ${esc(kit.kit)}</b>. The site updates in about a minute. <a href="index.html">Collection</a>`;
    form.reset(); countryHint.textContent = playerHint.textContent = brandHint.textContent = ''; delete brandHint.dataset.auto; seasonList();
  } catch (err) { result.textContent = 'Not saved. ' + err.message; }
});
forget.addEventListener('click', () => { localStorage.removeItem('gh_token'); forget.hidden = true; });
</script>
</body>
</html>
