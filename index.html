<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jersey Collection</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input { font-size: 16px; padding: 8px; flex: 1; min-width: 160px; }
  #kits { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  figure > img, .nophoto { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #eee; border-radius: 8px; display: block; }
  .nophoto { display: grid; place-items: center; overflow: hidden; }
  .nophoto > div { zoom: 1.5; }
  figcaption { margin-top: 4px; }
  small { color: #666; }
  .description { margin: 6px 0 2px; font-size: 14px; line-height: 1.35; }
  #season { background: #f4f4f4; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 14px; }
  h1 a { font-size: 14px; font-weight: normal; margin-left: 12px; }
  .wishlist { opacity: .5; }
</style>
</head>
<body>
<h1>Jersey Collection <a href="add.html">Add a kit</a></h1>
<form id="search">
  <input name="team" list="teams" placeholder="Club or national team" autocomplete="off">
  <input name="season" list="seasons" placeholder="Season, e.g. 2003/04" autocomplete="off">
  <datalist id="teams"></datalist>
  <datalist id="seasons"></datalist>
</form>
<p id="empty" hidden>Nothing for this team and season.</p>
<p id="archive" hidden>All kits of this season: <a target="_blank" rel="noopener"></a></p>
<div id="season" hidden></div>
<div id="kits"></div>
<script src="wiki.js"></script>
<script>
const seasonBox = document.getElementById('season');
const form = document.getElementById('search');
const grid = document.getElementById('kits');
const empty = document.getElementById('empty');
const archive = document.getElementById('archive');
let kits = [];

const norm = s => s.trim().toLowerCase();
const matches = (kit, team, season) =>
  (!team || norm(kit.team).includes(team)) && (!season || kit.season === season);

function fill(id, values) {
  document.getElementById(id).innerHTML = [...new Set(values)].sort()
    .map(v => `<option value="${v}">`).join('');
}

// shortcut: the archive's address pattern is guessed from its site, no API; switch to a kit API if it breaks
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
// "25/26" -> "2025-26", "99/00" -> "1999-00", "2014" stays: the archive's season format
const fullSeason = s => s.replace(/^(\d\d)\/(\d\d)$/, (_, a, b) => (a < 30 ? '20' : '19') + a + '-' + b);
function archiveLink(team, season) {
  const a = archive.querySelector('a');
  archive.hidden = !(team && season);
  a.href = `https://www.footballkitarchive.com/${slug(team)}-${fullSeason(season)}-kits/`;
  a.textContent = `${team} ${season} on Football Kit Archive`;
}

// The season's results from the club's Wikipedia season page, when there is one.
async function showSeason(team, season) {
  seasonBox.hidden = !(team && season);
  if (seasonBox.hidden) return;
  seasonBox.textContent = 'Looking up the season on Wikipedia…';
  try {
    const title = await wiki.findSeasonPage(team, season);
    if (!title) { seasonBox.textContent = 'No Wikipedia season page for this team and season.'; return; }
    const info = await wiki.seasonInfo(title);
    if (form.team.value.trim() !== team && !form.team.value.trim().startsWith(team)) return;
    const parts = info.competitions.map(c => `<b>${c.name}</b> ${c.result}`);
    if (info.topScorer) parts.push(`<b>Top scorer</b> ${info.topScorer}`);
    seasonBox.innerHTML = parts.join(' · ') + ` · <a href="${info.url}" target="_blank" rel="noopener">Wikipedia</a>`;
    // a card without a photo shows Wikipedia's drawing of that kit
    for (const box of grid.querySelectorAll('.nophoto[data-kit]')) box.innerHTML = info.kits[box.dataset.kit] || '';
  } catch (e) { seasonBox.textContent = 'Wikipedia did not answer: ' + e.message; }
}

function render() {
  const team = norm(form.team.value), season = form.season.value.trim();
  const found = kits.filter(k => matches(k, team, season));
  archiveLink(found[0]?.team || form.team.value.trim(), season);
  showSeason(found[0]?.team, season);
  empty.hidden = found.length > 0;
  grid.innerHTML = found.map(k => `
    <figure class="${k.status}">
      ${k.photo ? `<img src="photos/${k.photo}" alt="${k.team} ${k.season || ''} ${k.kit || ''}" loading="lazy">` : `<div class="nophoto" data-kit="${k.kit || ''}"></div>`}
      <figcaption>
        <b>${k.team}</b> ${k.season || ''} ${k.kit || ''}${k.status === 'yes' ? '' : ' · ' + k.status}<br>
        <small>${[k.brand, k.version, k.size, k.number && k.player ? `${k.number} ${k.player}` : k.number || k.player, k.comment].filter(Boolean).join(' · ')}</small>
        ${k.description ? `<p class="description">${k.description}</p>` : ''}
        ${k.link ? `<small><a href="${k.link}" target="_blank" rel="noopener">${new URL(k.link).hostname.replace(/^www\./, '')}</a></small>` : ''}
      </figcaption>
    </figure>`).join('');
}

fetch('kits.json').then(r => r.json()).then(data => {
  kits = data;
  fill('teams', kits.map(k => k.team));
  fill('seasons', kits.map(k => k.season));
  render();
});
form.addEventListener('input', render);
form.addEventListener('submit', e => e.preventDefault());
</script>
</body>
</html>
