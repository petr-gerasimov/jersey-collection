<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleven Jersey</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon.png" sizes="278x278">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html"><img src="logo.png" alt="Eleven Jersey" class="logo"></a>
  <a href="add.html" class="button">Add jersey</a>
</header>
<form id="search">
  <input name="team" list="teams" placeholder="Club or national team" autocomplete="off">
  <input name="season" list="seasons" placeholder="Season, e.g. 2003/04" autocomplete="off">
  <datalist id="teams"></datalist>
  <datalist id="seasons"></datalist>
</form>
<p id="empty" hidden>Nothing for this team and season.</p>
<p id="archive" hidden>All kits of this season: <a target="_blank" rel="noopener"></a></p>
<div id="season" hidden></div>
<div id="kits"></div>

<dialog id="detail">
  <button class="close" aria-label="Close">×</button>
  <div class="picture"></div>
  <div class="facts"></div>
</dialog>

<script src="wiki.js"></script>
<script>
const form = document.getElementById('search');
const grid = document.getElementById('kits');
const empty = document.getElementById('empty');
const archive = document.getElementById('archive');
const seasonBox = document.getElementById('season');
const detail = document.getElementById('detail');
let kits = [];

const norm = s => s.trim().toLowerCase();
const matches = (kit, team, season) =>
  (!team || norm(kit.team).includes(team)) && (!season || kit.season === season);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fill(id, values) {
  document.getElementById(id).innerHTML = [...new Set(values)].sort()
    .map(v => `<option value="${esc(v)}">`).join('');
}

// shortcut: the archive's address pattern is guessed from its site, no API; switch to a kit API if it breaks
function archiveLink(team, season) {
  const a = archive.querySelector('a');
  archive.hidden = !(team && season);
  a.href = `https://www.footballkitarchive.com/${slug(team)}-${wiki.fullSeason(season).replace('–', '-')}-kits/`;
  a.textContent = `${team} ${season} on Football Kit Archive`;
}

// The season's results from the club's Wikipedia season page, when there is one.
async function showSeason(team, season) {
  seasonBox.hidden = !(team && season);
  if (seasonBox.hidden) return;
  seasonBox.textContent = 'Looking up the season on Wikipedia…';
  try {
    const title = await wiki.findSeasonPage(team, season);
    if (!title) { seasonBox.textContent = 'No Wikipedia season page for this team and season.'; return; }
    seasonBox.innerHTML = seasonHtml(await wiki.seasonInfo(title));
  } catch (e) { seasonBox.textContent = 'Wikipedia did not answer: ' + e.message; }
}

const seasonHtml = info => [...info.competitions.map(c => `<b>${esc(c.name)}</b> ${esc(c.result)}`),
  info.topScorer && `<b>Top scorer</b> ${esc(info.topScorer)}`,
  `<a href="${info.url}" target="_blank" rel="noopener">Wikipedia</a>`].filter(Boolean).join(' · ');

// Wikipedia's drawing of a kit, for a card without a photo; '' when the season page or the kit is missing.
async function drawing(k) {
  try {
    const title = await wiki.findSeasonPage(k.team, k.season);
    return title ? (await wiki.seasonInfo(title)).kits[k.kit] || '' : '';
  } catch { return ''; }
}
// Drawings load as cards scroll into view, so the first screen costs a few requests, not one per kit.
const seen = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    seen.unobserve(e.target);
    drawing(kits[e.target.dataset.i]).then(html => { e.target.innerHTML = html; });
  }
}, { rootMargin: '200px' });

const picture = (k, i) => k.photo
  ? `<img src="photos/${esc(k.photo)}" alt="${esc(k.team)} ${esc(k.season || '')} ${esc(k.kit || '')}" loading="lazy">`
  : `<div class="nophoto" data-i="${i}"></div>`;
const line = k => [k.brand, k.version, k.size, k.number && k.player ? `${k.number} ${k.player}` : k.number || k.player, k.comment].filter(Boolean).map(esc).join(' · ');

function render() {
  const team = norm(form.team.value), season = form.season.value.trim();
  const found = kits.map((k, i) => [k, i]).filter(([k]) => matches(k, team, season));
  empty.hidden = found.length > 0;
  archiveLink(found[0]?.[0].team || form.team.value.trim(), season);
  showSeason(found[0]?.[0].team, season);
  grid.innerHTML = found.map(([k, i]) => `
    <figure class="${k.status}" data-i="${i}">
      ${picture(k, i)}
      <figcaption>
        <b>${esc(k.team)}</b> ${esc(k.season || '')} ${esc(k.kit || '')}${k.status === 'yes' ? '' : ' · ' + k.status}<br>
        <small>${line(k)}</small>
      </figcaption>
    </figure>`).join('');
  grid.querySelectorAll('.nophoto').forEach(el => seen.observe(el));
}

// A card opens the kit: picture, every field, the links.
function open(i) {
  const k = kits[i];
  const rows = [['Team', k.team], ['Country', k.country], ['Season', k.season], ['Kit', k.kit], ['Brand', k.brand], ['Version', k.version],
    ['Size', k.size], ['Number', k.number], ['Player', k.player], ['Status', { yes: 'in collection', bought: 'bought, on its way', wishlist: 'wishlist' }[k.status]], ['Notes', k.comment]]
    .filter(([, v]) => v);
  detail.querySelector('.picture').innerHTML = picture(k, i);
  detail.querySelector('.facts').innerHTML = `
    <h2>${esc(k.team)} <span>${esc(k.season || '')} ${esc(k.kit || '')}</span></h2>
    ${k.description ? `<p>${esc(k.description)}</p>` : ''}
    <dl>${rows.map(([n, v]) => `<dt>${n}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <p class="season"></p>
    <p class="links">
      ${k.link ? `<a href="${esc(k.link)}" target="_blank" rel="noopener">Item page</a>` : ''}
      ${k.season ? `<a href="https://www.footballkitarchive.com/${slug(k.team)}-${wiki.fullSeason(k.season).replace('–', '-')}-kits/" target="_blank" rel="noopener">Football Kit Archive</a>` : ''}
    </p>`;
  detail.showModal();
  if (!k.photo) drawing(k).then(html => { detail.querySelector('.nophoto').innerHTML = html; });
  if (k.season) wiki.findSeasonPage(k.team, k.season).then(t => t && wiki.seasonInfo(t))
    .then(info => { if (info && detail.open) detail.querySelector('.season').innerHTML = seasonHtml(info); }).catch(() => {});
}

fetch('kits.json').then(r => r.json()).then(data => {
  kits = data;
  fill('teams', kits.map(k => k.team));
  fill('seasons', kits.map(k => k.season).filter(Boolean));
  render();
});
form.addEventListener('input', render);
form.addEventListener('submit', e => e.preventDefault());
grid.addEventListener('click', e => { const f = e.target.closest('figure'); if (f) open(f.dataset.i); });
detail.querySelector('.close').addEventListener('click', () => detail.close());
detail.addEventListener('click', e => { if (e.target === detail) detail.close(); });
</script>
</body>
</html>
